<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Admin Login | EzyBite</title>
    <link rel="icon" type="image/png" href="../assets/images/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#ec4913' }, fontFamily: { sans: ['Be Vietnam Pro', 'sans-serif'] } } }
        }
    </script>
    <style>
        body { font-family: 'Be Vietnam Pro', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .filled-icon { font-variation-settings: 'FILL' 1; }
    </style>
</head>
<body class="bg-zinc-950 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-sm">
        <!-- Brand -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-primary rounded-2xl mb-4 shadow-2xl shadow-primary/40">
                <span class="material-symbols-outlined filled-icon text-white text-3xl">admin_panel_settings</span>
            </div>
            <h1 class="text-xl font-black text-white">EzyBite Admin</h1>
            <p class="text-[10px] text-white/30 font-bold uppercase tracking-[0.25em] mt-1">Authorized Access Only</p>
        </div>

        <!-- Card -->
        <div class="bg-zinc-900 rounded-2xl border border-white/5 p-6 shadow-2xl">

            <!-- Error box -->
            <div id="login-error" class="hidden mb-4 p-3 bg-red-500/10 border border-red-500/20 rounded-xl text-red-400 text-xs font-bold flex items-center gap-2">
                <span class="material-symbols-outlined text-sm filled-icon shrink-0">error</span>
                <span id="login-error-text">Access denied.</span>
            </div>

            <form id="login-form" autocomplete="off" onsubmit="event.preventDefault(); adminLogin()" class="space-y-4">
                <!-- Email -->
                <div>
                    <label class="text-[10px] font-black uppercase tracking-widest text-white/30 mb-1.5 block">Email</label>
                    <div class="flex items-center gap-2.5 bg-zinc-800 border border-white/10 rounded-xl px-3 py-2.5 focus-within:border-primary/50 transition-colors">
                        <span class="material-symbols-outlined text-white/20 text-sm">email</span>
                        <input id="login-email" type="email" name="username" placeholder="Admin email address" autocomplete="off"
                               class="flex-1 bg-transparent text-white text-sm font-bold placeholder:text-white/20 outline-none" />
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label class="text-[10px] font-black uppercase tracking-widest text-white/30 mb-1.5 block">Password</label>
                    <div class="flex items-center gap-2.5 bg-zinc-800 border border-white/10 rounded-xl px-3 py-2.5 focus-within:border-primary/50 transition-colors">
                        <span class="material-symbols-outlined text-white/20 text-sm">lock</span>
                        <input id="login-password" type="password" name="password" placeholder="Password" autocomplete="off"
                               class="flex-1 bg-transparent text-white text-sm font-bold placeholder:text-white/20 outline-none" />
                        <button type="button" onclick="togglePw()" class="text-white/20 hover:text-white/60 transition-colors focus:outline-none">
                            <span id="pw-eye" class="material-symbols-outlined text-sm">visibility</span>
                        </button>
                    </div>
                </div>

                <!-- Submit -->
                <button id="login-btn" type="submit"
                        class="w-full bg-primary hover:bg-primary/90 text-white py-3 rounded-xl font-black text-sm transition-all flex items-center justify-center gap-2 shadow-lg shadow-primary/30 active:scale-95 mt-2">
                    <span class="material-symbols-outlined text-sm filled-icon">login</span>
                    Enter Dashboard
                </button>
            </form>
        </div>

        <p class="text-center text-[10px] text-white/15 font-bold mt-6 uppercase tracking-widest">
            EzyBite &copy; 2026 &bull; Admin Panel
        </p>
    </div>

    <script>
        function togglePw() {
            const pw = document.getElementById('login-password');
            const eye = document.getElementById('pw-eye');
            const isHidden = pw.type === 'password';
            pw.type = isHidden ? 'text' : 'password';
            eye.textContent = isHidden ? 'visibility_off' : 'visibility';
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

        const ADMIN_EMAILS = [
            'peterkelvinkibiru1532@gmail.com',
            'sabastianthuo3@gmail.com',
        ];

        const firebaseConfig = {
            apiKey: "AIzaSyAUHuu9d7PqI2X3g-_OyGjtnJY6fl_G88s",
            authDomain: "ezybite-d44c5.firebaseapp.com",
            projectId: "ezybite-d44c5",
            storageBucket: "ezybite-d44c5.firebasestorage.app",
            messagingSenderId: "77854577474",
            appId: "1:77854577474:web:1b90df9ccb4b355ec4eedb"
        };

        const app  = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        function showError(msg) {
            const errorBox  = document.getElementById('login-error');
            const errorText = document.getElementById('login-error-text');
            errorText.textContent = msg;
            errorBox.classList.remove('hidden');
            const btn = document.getElementById('login-btn');
            btn.disabled = false;
            btn.innerHTML = '<span class="material-symbols-outlined text-sm filled-icon">login</span> Enter Dashboard';
        }

        // If a valid admin is already signed in, redirect immediately.
        // If a non-admin is somehow signed in, sign them out.
        onAuthStateChanged(auth, (user) => {
            if (!user) return;
            if (ADMIN_EMAILS.includes(user.email)) {
                window.location.replace('index.html');
            } else {
                signOut(auth);
            }
        });

        window.adminLogin = async () => {
            const email    = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const btn      = document.getElementById('login-btn');
            const errorBox = document.getElementById('login-error');

            errorBox.classList.add('hidden');

            if (!email || !password) {
                showError('Please enter your email and password.');
                return;
            }

            if (!ADMIN_EMAILS.includes(email)) {
                showError('Access denied. This account is not authorised as admin.');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined text-sm" style="animation:spin 0.6s linear infinite;display:inline-block">sync</span> Signing in…';

            try {
                await signInWithEmailAndPassword(auth, email, password);
                // onAuthStateChanged handles the redirect
            } catch (err) {
                const msgs = {
                    'auth/invalid-email':          'That doesn\'t look like a valid email address.',
                    'auth/user-not-found':         'No account found with that email.',
                    'auth/wrong-password':         'Incorrect password. Please try again.',
                    'auth/invalid-credential':     'Invalid email or password.',
                    'auth/user-disabled':          'This account has been disabled.',
                    'auth/too-many-requests':      'Too many failed attempts. Please wait a moment.',
                    'auth/network-request-failed': 'Network error. Check your connection.',
                };
                showError(msgs[err.code] || 'Sign in failed. Please try again.');
            }
        };
    </script>
    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</body>
</html>
