    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background: #0f0d0c;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Radial glow background */
        .bg-glow {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 60% 50% at 50% 60%, rgba(236,73,19,0.18) 0%, transparent 70%);
            pointer-events: none;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            text-align: center;
            padding: 24px;
            animation: fadeIn 0.5s ease both;
        }

        /* Logo pulse ring */
        .logo-wrap {
            position: relative;
            width: 80px;
            height: 80px;
        }
        .logo-ring {
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 2px solid rgba(236,73,19,0.4);
            animation: ring 1.8s ease-in-out infinite;
        }
        .logo-ring:nth-child(2) { inset: -14px; border-color: rgba(236,73,19,0.15); animation-delay: 0.4s; }
        .logo-wrap img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            position: relative;
            z-index: 1;
            border: 3px solid rgba(236,73,19,0.3);
        }

        @keyframes ring {
            0%   { transform: scale(1);   opacity: 1; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        .brand {
            font-size: 2rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.03em;
            line-height: 1;
        }
        .brand span { color: #ec4913; }

        .tagline {
            font-size: 0.65rem;
            font-weight: 800;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.25);
            margin-top: -4px;
        }

        /* Progress bar */
        .progress-track {
            width: 160px;
            height: 3px;
            background: rgba(255,255,255,0.06);
            border-radius: 99px;
            overflow: hidden;
            margin-top: 8px;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ec4913, #ff7043);
            border-radius: 99px;
            animation: fill 1.8s cubic-bezier(0.4,0,0.2,1) forwards;
        }
        @keyframes fill {
            0%   { width: 0%; }
            60%  { width: 75%; }
            100% { width: 100%; }
        }

        .status {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.2);
            animation: blink 1s ease-in-out infinite alternate;
        }
        @keyframes blink { from { opacity: 0.3; } to { opacity: 0.8; } }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      "url": "https://ezy-bite.netlify.app",

      "servesCuisine": ["Kenyan", "Snacks", "Fast Food"],
      "areaServed": { "@type": "Place", "name": "University of Embu, Kenya" },

    }
    </script>
