    <script type="module" src="../js/firebase-service.js"></script>

    <script>
        const TAG_LABELS = {
            info: 'Info', promo: 'Promo', deal: 'Deal', feature: 'New Feature', alert: 'Alert'
        };

        function timeAgo(seconds) {
            const diff = Math.floor(Date.now() / 1000) - seconds;
            if (diff < 60)    return 'Just now';
            if (diff < 3600)  return `${Math.floor(diff / 60)}m ago`;
            if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
            const d = Math.floor(diff / 86400);
            if (d < 30) return `${d}d ago`;
            return new Date(seconds * 1000).toLocaleDateString('en-KE', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function isNew(seconds) {
            const lastRead = parseInt(localStorage.getItem('ezybite_last_read_updates') || '0');
            return (seconds * 1000) > lastRead;
        }

        function renderUpdates(updates) {
            const listEl  = document.getElementById('updates-list');
            const emptyEl = document.getElementById('updates-empty');

            if (!updates.length) {
                listEl.classList.add('hidden');
                emptyEl.classList.remove('hidden');
                return;
            }
            emptyEl.classList.add('hidden');
            listEl.classList.remove('hidden');

            listEl.innerHTML = updates.map((u, i) => {
                const newItem = isNew(u.createdAt?.seconds || 0);
                const tag = u.tag || 'info';
                const tagLabel = TAG_LABELS[tag] || tag;
                const date = timeAgo(u.createdAt?.seconds || 0);

                // Icon per tag
                const icons = { info: 'info', promo: 'local_offer', deal: 'sell', feature: 'new_releases', alert: 'warning' };
                const icon = icons[tag] || 'notifications';

                return `
                <div class="update-card group relative bg-white dark:bg-zinc-900 rounded-2xl border ${newItem ? 'border-primary/25 dark:border-primary/20 shadow-primary/8 shadow-lg' : 'border-primary/8 dark:border-white/8'} p-5 overflow-hidden"
                     style="animation-delay: ${i * 50}ms">
                    ${newItem ? `<div class="absolute inset-0 bg-primary/3 dark:bg-primary/5 pointer-events-none rounded-2xl"></div>` : ''}
                    <div class="relative flex items-start gap-4">
                        <!-- Icon -->
                        <div class="w-11 h-11 rounded-xl bg-primary/10 flex items-center justify-center shrink-0">
                            <span class="material-symbols-outlined text-primary text-xl filled-icon">${icon}</span>
                        </div>
                        <!-- Content -->
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 flex-wrap mb-1.5">
                                <h3 class="text-base font-black dark:text-white leading-tight">${u.title}</h3>
                                ${newItem ? `<span class="flex items-center gap-1 text-[9px] font-black uppercase tracking-widest text-primary bg-primary/10 px-1.5 py-0.5 rounded-full"><span class="w-1.5 h-1.5 bg-primary rounded-full pulse-dot inline-block"></span> New</span>` : ''}
                                <span class="text-[9px] font-black uppercase tracking-widest px-2 py-1 rounded-full tag-${tag} ml-auto shrink-0">${tagLabel}</span>
                            </div>
                            ${u.body ? `<p class="text-sm font-medium text-[#181311]/65 dark:text-white/55 leading-relaxed">${u.body}</p>` : ''}
                            <p class="text-xs text-primary/30 dark:text-white/20 font-bold mt-2">${date}</p>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        async function loadUpdates() {
            try {
                const updates = await window.fb_getUpdates();
                document.getElementById('updates-skeleton').classList.add('hidden');
                renderUpdates(updates);
            } catch (err) {
                document.getElementById('updates-skeleton').classList.add('hidden');
                document.getElementById('updates-empty').classList.remove('hidden');
                console.error('Failed to load updates:', err);
            }
        }

        // Mark all as read when this page is visited
        function markAsRead() {
            localStorage.setItem('ezybite_last_read_updates', Date.now().toString());
            // Clear badge everywhere on this page
            document.querySelectorAll('#updates-badge, #updates-badge-mobile').forEach(el => {
                el.textContent = '0';
                el.classList.add('hidden');
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Mark read immediately
            markAsRead();

            const tryLoad = () => {
                if (typeof window.fb_getUpdates === 'function') {
                    loadUpdates();
                } else {
                    setTimeout(tryLoad, 300);
                }
            };
            tryLoad();
        });
    </script>
