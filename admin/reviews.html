<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta name="robots" content="noindex, nofollow, noarchive">
    <link rel="icon" type="image/png" href="../assets/images/logo.png">
    <title>Reviews | EzyBite Admin</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { extend: { colors: { primary: "#ec4913" }, fontFamily: { display: ["Be Vietnam Pro"] } } }
        }
    </script>
    <style>
        body { font-family: 'Be Vietnam Pro', sans-serif; background: #09090b; color: #fff; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .filled-icon { font-variation-settings: 'FILL' 1; }
    </style>
</head>
<body class="dark min-h-screen">
<div id="admin-sidebar-placeholder"></div>

<div class="md:pl-44 pt-11 md:pt-0 min-h-screen">
    <div class="p-4 lg:p-6 max-w-4xl mx-auto">

        <!-- Header -->
        <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
            <div>
                <h1 class="text-xl font-black text-white leading-none">Reviews</h1>
                <p class="text-white/40 text-xs font-medium mt-1">View and moderate customer reviews</p>
            </div>
            <div class="flex items-center gap-2">
                <!-- Stats pills -->
                <div class="flex items-center gap-1.5 px-3 py-1.5 bg-zinc-900 border border-white/10 rounded-xl">
                    <span class="material-symbols-outlined text-yellow-400 text-sm filled-icon">star</span>
                    <span id="avg-display" class="text-xs font-black text-white">— / 5</span>
                </div>
                <div class="flex items-center gap-1.5 px-3 py-1.5 bg-zinc-900 border border-white/10 rounded-xl">
                    <span class="material-symbols-outlined text-white/30 text-sm">reviews</span>
                    <span id="count-display" class="text-xs font-black text-white">0 reviews</span>
                </div>
            </div>
        </div>

        <!-- Filter bar -->
        <div class="flex items-center gap-2 mb-4 flex-wrap">
            <button onclick="setFilter('all', this)" id="filter-all"
                    class="filter-btn px-3 py-1.5 rounded-xl text-xs font-black bg-primary text-white transition-all">
                All
            </button>
            <button onclick="setFilter(5, this)"
                    class="filter-btn px-3 py-1.5 rounded-xl text-xs font-black bg-zinc-900 border border-white/10 text-white/50 hover:text-white hover:border-white/20 transition-all">
                ⭐⭐⭐⭐⭐ 5 stars
            </button>
            <button onclick="setFilter(4, this)"
                    class="filter-btn px-3 py-1.5 rounded-xl text-xs font-black bg-zinc-900 border border-white/10 text-white/50 hover:text-white hover:border-white/20 transition-all">
                ⭐⭐⭐⭐ 4 stars
            </button>
            <button onclick="setFilter(3, this)"
                    class="filter-btn px-3 py-1.5 rounded-xl text-xs font-black bg-zinc-900 border border-white/10 text-white/50 hover:text-white hover:border-white/20 transition-all">
                ⭐⭐⭐ 3 &amp; below
            </button>
            <button onclick="setFilter('anon', this)"
                    class="filter-btn px-3 py-1.5 rounded-xl text-xs font-black bg-zinc-900 border border-white/10 text-white/50 hover:text-white hover:border-white/20 transition-all">
                Anonymous only
            </button>
        </div>

        <!-- Skeleton -->
        <div id="reviews-loading" class="space-y-3">
            <div class="h-24 bg-zinc-900 rounded-2xl animate-pulse border border-white/5"></div>
            <div class="h-24 bg-zinc-900 rounded-2xl animate-pulse border border-white/5"></div>
            <div class="h-20 bg-zinc-900 rounded-2xl animate-pulse border border-white/5"></div>
        </div>

        <!-- List -->
        <div id="reviews-list" class="hidden space-y-3"></div>

        <!-- Empty -->
        <div id="reviews-empty" class="hidden py-20 text-center opacity-30">
            <span class="material-symbols-outlined text-5xl block mb-3 filled-icon">rate_review</span>
            <p class="text-base font-bold uppercase tracking-widest">No reviews yet</p>
        </div>
    </div>
</div>

<!-- Delete Confirm -->
<div id="delete-modal"
     class="fixed inset-0 z-[300] hidden items-center justify-center bg-black/70 backdrop-blur-sm">
    <div class="bg-zinc-900 border border-white/10 rounded-2xl w-full max-w-xs mx-4 p-5 shadow-2xl">
        <div class="text-center mb-4">
            <div class="w-12 h-12 bg-red-500/10 rounded-full flex items-center justify-center mx-auto mb-3">
                <span class="material-symbols-outlined text-red-400 text-2xl filled-icon">delete</span>
            </div>
            <p class="text-sm font-black text-white">Delete this review?</p>
            <p class="text-xs font-medium text-white/40 mt-1.5 leading-relaxed" id="delete-preview"></p>
        </div>
        <div class="flex gap-2">
            <button onclick="closeDeleteModal()"
                    class="flex-1 py-2.5 rounded-xl text-sm font-black border border-white/10 hover:bg-white/5 text-white/60 transition-all active:scale-95">
                Cancel
            </button>
            <button onclick="confirmDelete()" id="delete-confirm-btn"
                    class="flex-1 py-2.5 rounded-xl text-sm font-black bg-red-500 text-white hover:bg-red-600 transition-all active:scale-95">
                Delete
            </button>
        </div>
    </div>
</div>

<script type="module" src="../js/firebase-service.js"></script>
<script src="admin-shell.js"></script>
<script src="admin-auth.js"></script>
<script>
    let allReviews = [];
    let activeFilter = 'all';
    let pendingDeleteId = null;

    function stars(n) {
        return [1,2,3,4,5].map(i =>
            `<span class="material-symbols-outlined text-sm filled-icon" style="color:${i<=n?'#fbbf24':'rgba(255,255,255,0.1)'}">star</span>`
        ).join('');
    }

    function timeAgo(seconds) {
        if (!seconds) return '—';
        const diff = Math.floor(Date.now() / 1000) - seconds;
        if (diff < 60)    return 'Just now';
        if (diff < 3600)  return `${Math.floor(diff / 60)}m ago`;
        if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
        const d = Math.floor(diff / 86400);
        if (d < 30) return `${d}d ago`;
        return new Date(seconds * 1000).toLocaleDateString('en-KE', { day:'numeric', month:'short', year:'numeric' });
    }

    function setFilter(val, btn) {
        activeFilter = val;
        document.querySelectorAll('.filter-btn').forEach(b => {
            b.classList.remove('bg-primary', 'text-white');
            b.classList.add('bg-zinc-900', 'border', 'border-white/10', 'text-white/50');
        });
        btn.classList.add('bg-primary', 'text-white');
        btn.classList.remove('bg-zinc-900', 'border', 'border-white/10', 'text-white/50');
        renderList();
    }

    function filtered() {
        if (activeFilter === 'all')  return allReviews;
        if (activeFilter === 'anon') return allReviews.filter(r => r.anonymous);
        if (activeFilter === 3)      return allReviews.filter(r => r.rating <= 3);
        return allReviews.filter(r => r.rating === activeFilter);
    }

    function renderList() {
        const listEl  = document.getElementById('reviews-list');
        const emptyEl = document.getElementById('reviews-empty');
        const items   = filtered();

        if (!items.length) {
            listEl.classList.add('hidden');
            emptyEl.classList.remove('hidden');
            return;
        }
        emptyEl.classList.add('hidden');
        listEl.classList.remove('hidden');

        listEl.innerHTML = items.map(r => {
            const name    = r.anonymous ? 'Anonymous' : (r.displayName || 'Guest');
            const initials = name === 'Anonymous' ? '?' : name.charAt(0).toUpperCase();
            const date    = timeAgo(r.createdAt?.seconds || 0);
            const comment = r.comment ? r.comment.replace(/</g, '&lt;') : '';
            return `
            <div class="flex items-start gap-3 p-4 bg-zinc-900 border border-white/5 rounded-2xl hover:border-white/10 transition-all group">
                <!-- Avatar -->
                <div class="w-9 h-9 rounded-full flex items-center justify-center shrink-0 font-black text-sm mt-0.5
                            ${r.anonymous ? 'bg-white/10 text-white/30' : 'bg-primary/20 text-primary'}">
                    ${initials}
                </div>
                <!-- Body -->
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 flex-wrap mb-0.5">
                        <span class="text-sm font-black text-white leading-tight">${name}</span>
                        ${r.anonymous ? `<span class="text-[9px] font-black uppercase tracking-widest px-1.5 py-0.5 rounded-full bg-white/5 text-white/25">Anonymous</span>` : ''}
                        <div class="flex items-center gap-0.5 ml-auto">${stars(r.rating || 0)}</div>
                    </div>
                    ${comment ? `<p class="text-xs font-medium text-white/55 leading-relaxed mt-0.5 break-words">${comment}</p>` : `<p class="text-xs text-white/20 italic">No comment</p>`}
                    <p class="text-[10px] text-white/20 font-bold mt-1.5">${date}</p>
                </div>
                <!-- Delete btn -->
                <button onclick="openDeleteModal('${r.id}', \`${name}: ${(r.comment||'').substring(0,40).replace(/`/g,"'")}\`)"
                        class="shrink-0 w-8 h-8 flex items-center justify-center bg-red-500/0 hover:bg-red-500/10 rounded-xl text-white/20 hover:text-red-400 transition-all active:scale-90 opacity-0 group-hover:opacity-100">
                    <span class="material-symbols-outlined text-base">delete</span>
                </button>
            </div>`;
        }).join('');
    }

    function updateStats() {
        const total = allReviews.length;
        const avg   = total ? (allReviews.reduce((s, r) => s + (r.rating || 0), 0) / total).toFixed(1) : '—';
        document.getElementById('avg-display').textContent  = `${avg} / 5`;
        document.getElementById('count-display').textContent = `${total} review${total !== 1 ? 's' : ''}`;
    }

    async function loadPageData() {
        document.getElementById('reviews-loading').classList.remove('hidden');
        document.getElementById('reviews-list').classList.add('hidden');
        document.getElementById('reviews-empty').classList.add('hidden');
        try {
            allReviews = await window.fb_getReviews();
            document.getElementById('reviews-loading').classList.add('hidden');
            updateStats();
            renderList();
        } catch (err) {
            document.getElementById('reviews-loading').classList.add('hidden');
            document.getElementById('reviews-empty').classList.remove('hidden');
            console.error('Failed to load reviews:', err);
        }
    }

    function openDeleteModal(id, preview) {
        pendingDeleteId = id;
        document.getElementById('delete-preview').textContent = preview;
        const m = document.getElementById('delete-modal');
        m.classList.remove('hidden'); m.classList.add('flex');
    }

    function closeDeleteModal() {
        pendingDeleteId = null;
        const m = document.getElementById('delete-modal');
        m.classList.add('hidden'); m.classList.remove('flex');
    }

    async function confirmDelete() {
        if (!pendingDeleteId) return;
        const btn = document.getElementById('delete-confirm-btn');
        btn.disabled = true; btn.textContent = 'Deleting…';
        try {
            await window.fb_deleteReview(pendingDeleteId);
            closeDeleteModal();
            window.showToast && window.showToast('Review deleted.', 'success');
            loadPageData();
        } catch (err) {
            btn.disabled = false; btn.textContent = 'Delete';
            window.showToast && window.showToast('Failed: ' + err.message, 'error');
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const tryLoad = () => {
            if (typeof window.fb_getReviews === 'function') loadPageData();
            else setTimeout(tryLoad, 300);
        };
        tryLoad();
    });
</script>
</body>
</html>
