<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta name="robots" content="noindex, nofollow">
    <title>Profile | EzyBite</title>
    <link rel="icon" type="image/png" href="../assets/images/logo.png">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec4913",
                        "background-light": "#f8f6f6",
                        "background-dark": "#181311",
                    },
                    fontFamily: {
                        "display": ["Be Vietnam Pro"]
                    }
                },
            },
        }
    </script>
    <style>
        body { font-family: 'Be Vietnam Pro', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .filled-icon { font-variation-settings: 'FILL' 1; }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-[#181311] dark:text-white min-h-screen">

<div id="header-placeholder"></div>

<!-- Corporate Minimalist Dashboard -->
<main class="max-w-[1440px] mx-auto px-6 lg:px-20 py-24 min-h-[calc(100vh-250px)] flex flex-col items-center justify-center">
    <div class="w-full max-w-2xl animate-in fade-in zoom-in-95 duration-700">
        
        <!-- Refined Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl lg:text-4xl font-bold dark:text-white mb-2 tracking-tight">
                Welcome back, <span id="user-display-name-greeting" class="text-primary font-black">User</span>
            </h1>
            <p class="text-xs font-black uppercase tracking-[0.4em] text-primary/30">Dashboard Overview</p>
        </div>

        <!-- Quick Action Bar (always visible at top) -->
        <div class="flex items-center justify-center gap-4 mb-10 p-4 bg-white dark:bg-zinc-900/60 rounded-2xl border border-primary/8 shadow-sm">
            <!-- Order History -->
            <button onclick="openModal('history-modal')" class="flex-1 flex flex-col items-center gap-1.5 py-2 rounded-xl text-primary/50 hover:text-primary hover:bg-primary/5 transition-all group">
                <span class="material-symbols-outlined text-xl group-hover:scale-110 transition-transform">history</span>
                <span class="text-[9px] font-black uppercase tracking-widest">History</span>
            </button>
            <div class="w-px h-8 bg-primary/10"></div>
            <!-- Bite Club -->
            <a href="satisfaction.html" class="flex-1 flex flex-col items-center gap-1.5 py-2 rounded-xl text-primary hover:bg-primary/5 transition-all group">
                <span class="material-symbols-outlined text-xl filled-icon group-hover:scale-110 transition-transform">stars</span>
                <span class="text-[9px] font-black uppercase tracking-widest">Bite Club</span>
            </a>
            <div class="w-px h-8 bg-primary/10"></div>
            <!-- Settings -->
            <button onclick="openModal('settings-modal')" class="flex-1 flex flex-col items-center gap-1.5 py-2 rounded-xl text-primary/50 hover:text-primary hover:bg-primary/5 transition-all group">
                <span class="material-symbols-outlined text-xl group-hover:scale-110 transition-transform">settings</span>
                <span class="text-[9px] font-black uppercase tracking-widest">Settings</span>
            </button>
            <div class="w-px h-8 bg-primary/10"></div>
            <!-- Sign Out -->
            <button onclick="handleSignOut()" class="flex-1 flex flex-col items-center gap-1.5 py-2 rounded-xl text-red-400 hover:bg-red-50 dark:hover:bg-red-500/10 hover:text-red-500 transition-all group">
                <span class="material-symbols-outlined text-xl group-hover:scale-110 transition-transform">logout</span>
                <span class="text-[9px] font-black uppercase tracking-widest">Logout</span>
            </button>
        </div>

        <!-- Dashboard Stats Grid (Horizontal/Compact) -->
        <div class="grid grid-cols-2 gap-4 mb-8">
            <!-- Points Card (BitePoints) -->
            <div class="bg-white dark:bg-zinc-900/50 p-6 rounded-[2rem] border border-primary/5 shadow-2xl relative overflow-hidden group flex flex-col justify-center">
                <div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-transparent"></div>
                <div class="relative z-10">
                    <div class="flex items-center gap-2 mb-2 opacity-30">
                        <span class="material-symbols-outlined text-sm">stars</span>
                        <span class="text-[8px] font-black uppercase tracking-widest">BitePoints</span>
                    </div>
                    <span id="user-points" class="text-5xl font-black text-primary leading-none drop-shadow-xl">0</span>
                </div>
            </div>

            <!-- Orders Card -->
            <div class="bg-white dark:bg-zinc-900/50 p-6 rounded-[2rem] border border-primary/5 shadow-2xl relative overflow-hidden group flex flex-col justify-center">
                <div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-transparent"></div>
                <div class="relative z-10">
                    <div class="flex items-center gap-2 mb-2 opacity-30">
                        <span class="material-symbols-outlined text-sm">receipt_long</span>
                        <span class="text-[8px] font-black uppercase tracking-widest">Total Orders</span>
                    </div>
                    <span id="user-order-count" class="text-5xl font-black dark:text-white leading-none drop-shadow-xl">0</span>
                </div>
            </div>
        </div>

        <!-- Primary Action Button: Start Order -->
        <a href="index.html" class="w-full py-6 bg-primary text-white rounded-[2rem] font-black text-lg hover:scale-[1.02] active:scale-95 shadow-2xl shadow-primary/30 transition-all flex items-center justify-center gap-4 mb-8">
            <span class="material-symbols-outlined font-black">add_shopping_cart</span>
            Start a New Order
        </a>

        <!-- Pending Orders Section -->
        <div id="pending-orders-section" class="mb-8">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2">
                    <span class="relative flex h-2.5 w-2.5">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-primary"></span>
                    </span>
                    <h3 class="text-xs font-black uppercase tracking-[0.25em] text-primary/70">Active Orders</h3>
                </div>
                <a href="orders.html" class="text-[10px] font-black uppercase tracking-widest text-primary/40 hover:text-primary transition-colors">See All →</a>
            </div>
            <div id="pending-orders-list" class="space-y-3">
                <!-- Skeleton -->
                <div class="animate-pulse h-20 bg-white dark:bg-zinc-900/50 rounded-2xl border border-primary/5"></div>
            </div>
        </div>

    </div>
</main>

<div id="footer-placeholder"></div>
<div id="modals-placeholder"></div>

<script src="../js/ui-components.js"></script>
<script type="module" src="../js/firebase-service.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
