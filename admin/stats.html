<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta name="robots" content="noindex, nofollow, noarchive">
    <link rel="icon" type="image/png" href="../assets/images/logo.png">
    <title>Statistics | EzyBite Admin</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { extend: { colors: { primary: "#ec4913" }, fontFamily: { display: ["Be Vietnam Pro"] } } }
        }
    </script>
    <style>
        body { font-family: 'Be Vietnam Pro', sans-serif; background: #09090b; color: #fff; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .filled-icon { font-variation-settings: 'FILL' 1; }
    </style>
</head>
<body class="dark min-h-screen">
<div id="admin-sidebar-placeholder"></div>

<div class="md:pl-44 pt-11 md:pt-0 min-h-screen">
    <div class="p-4 lg:p-6">

        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-xl font-black text-white leading-none">Statistics</h1>
                <p class="text-white/40 text-xs font-medium mt-1">Order volume, revenue & payment breakdown</p>
            </div>
            <button onclick="loadPageData()"
                    class="w-8 h-8 flex items-center justify-center bg-white/5 hover:bg-white/10 rounded-full text-white/60 hover:text-white transition-all" title="Refresh">
                <span class="material-symbols-outlined text-lg">refresh</span>
            </button>
        </div>

        <!-- Stat Cards -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
            <div class="bg-zinc-900 border border-white/5 rounded-2xl p-4">
                <p class="text-[9px] font-black uppercase tracking-widest text-white/30 mb-1">Total Orders</p>
                <p class="text-2xl font-black text-white" id="s-total">—</p>
            </div>
            <div class="bg-zinc-900 border border-white/5 rounded-2xl p-4">
                <p class="text-[9px] font-black uppercase tracking-widest text-white/30 mb-1">Revenue</p>
                <p class="text-2xl font-black text-primary" id="s-revenue">—</p>
            </div>
            <div class="bg-zinc-900 border border-white/5 rounded-2xl p-4">
                <p class="text-[9px] font-black uppercase tracking-widest text-white/30 mb-1">Paid Orders</p>
                <p class="text-2xl font-black text-green-400" id="s-paid">—</p>
            </div>
            <div class="bg-zinc-900 border border-white/5 rounded-2xl p-4">
                <p class="text-[9px] font-black uppercase tracking-widest text-white/30 mb-1">Unpaid Orders</p>
                <p class="text-2xl font-black text-orange-400" id="s-unpaid">—</p>
            </div>
        </div>

        <!-- Charts Row -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
            <!-- Orders per Day Chart -->
            <div class="bg-zinc-900 border border-white/5 rounded-2xl p-4">
                <p class="text-xs font-black uppercase tracking-widest text-white/50 mb-4">Orders — Last 7 Days</p>
                <div class="relative" style="height:200px">
                    <canvas id="ordersChart"></canvas>
                </div>
            </div>
            <!-- Revenue per Day Chart -->
            <div class="bg-zinc-900 border border-white/5 rounded-2xl p-4">
                <p class="text-xs font-black uppercase tracking-widest text-white/50 mb-4">Revenue (Ksh) — Last 7 Days</p>
                <div class="relative" style="height:200px">
                    <canvas id="revenueChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Bottom Row: Status Chart + Recent Orders + Ratings -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-4">
            <div class="bg-zinc-900 border border-white/5 rounded-2xl p-4">
                <p class="text-xs font-black uppercase tracking-widest text-white/50 mb-4">Payment Status Breakdown</p>
                <div class="relative" style="height:180px">
                    <canvas id="statusChart"></canvas>
                </div>
            </div>

            <!-- Recent Orders Summary Table -->
            <div class="lg:col-span-2 bg-zinc-900 border border-white/5 rounded-2xl p-4 overflow-hidden">
                <p class="text-xs font-black uppercase tracking-widest text-white/50 mb-4">Recent Orders</p>
                <div id="recent-orders-table" class="space-y-2 max-h-[200px] overflow-y-auto">
                    <div class="h-8 bg-zinc-800 rounded-lg animate-pulse"></div>
                    <div class="h-8 bg-zinc-800 rounded-lg animate-pulse"></div>
                    <div class="h-8 bg-zinc-800 rounded-lg animate-pulse"></div>
                </div>
            </div>
        </div>

        <!-- Ratings Section -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <!-- Ratings Bar Chart -->
            <div class="bg-zinc-900 border border-white/5 rounded-2xl p-4">
                <div class="flex items-center justify-between mb-1">
                    <p class="text-xs font-black uppercase tracking-widest text-white/50">Customer Ratings</p>
                    <a href="../pages/reviews.html" target="_blank"
                       class="text-[9px] font-black uppercase tracking-widest text-primary hover:text-white transition-colors">
                        View All →
                    </a>
                </div>
                <div class="flex items-center gap-3 mb-4">
                    <span id="ratings-avg" class="text-3xl font-black text-yellow-400">—</span>
                    <div>
                        <div id="ratings-stars" class="flex gap-0.5 mb-0.5"></div>
                        <p id="ratings-count" class="text-[10px] text-white/30 font-bold">0 reviews</p>
                    </div>
                </div>
                <div class="relative" style="height:160px">
                    <canvas id="ratingsChart"></canvas>
                </div>
            </div>

            <!-- Ratings Distribution (text bars) -->
            <div class="bg-zinc-900 border border-white/5 rounded-2xl p-4">
                <p class="text-xs font-black uppercase tracking-widest text-white/50 mb-4">Rating Breakdown</p>
                <div id="ratings-breakdown" class="space-y-2.5">
                    <div class="h-6 bg-zinc-800 rounded-lg animate-pulse"></div>
                    <div class="h-6 bg-zinc-800 rounded-lg animate-pulse"></div>
                    <div class="h-6 bg-zinc-800 rounded-lg animate-pulse"></div>
                    <div class="h-6 bg-zinc-800 rounded-lg animate-pulse"></div>
                    <div class="h-6 bg-zinc-800 rounded-lg animate-pulse"></div>
                </div>
            </div>
        </div>

    </div>
</div>

<script type="module" src="../js/firebase-service.js"></script>
<script src="admin-shell.js"></script>
<script>
    let ordersChartInst, revenueChartInst, statusChartInst, ratingsChartInst;

    const chartDefaults = {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
            x: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: 'rgba(255,255,255,0.4)', font: { family: 'Be Vietnam Pro', size: 10, weight: '700' } } },
            y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: 'rgba(255,255,255,0.4)', font: { family: 'Be Vietnam Pro', size: 10, weight: '700' } }, beginAtZero: true }
        }
    };

    async function loadPageData() {
        if (typeof window.fb_getOrdersWithStats !== 'function') return;
        try {
            const { orders, days, paid, failed, unpaid } = await window.fb_getOrdersWithStats();
            const totalRevenue = orders.reduce((s, o) => s + (o.status === 'paid' || o.paymentStatus === 'paid' ? (o.total || 0) : 0), 0);

            document.getElementById('s-total').textContent = orders.length;
            document.getElementById('s-revenue').textContent = `Ksh ${totalRevenue.toLocaleString()}`;
            document.getElementById('s-paid').textContent = paid;
            document.getElementById('s-unpaid').textContent = unpaid;

            const labels = days.map(d => d.label);
            const counts = days.map(d => d.count);
            const revenues = days.map(d => d.revenue);

            // Orders chart
            if (ordersChartInst) ordersChartInst.destroy();
            ordersChartInst = new Chart(document.getElementById('ordersChart'), {
                type: 'bar',
                data: {
                    labels,
                    datasets: [{
                        data: counts,
                        backgroundColor: 'rgba(236,73,19,0.7)',
                        borderColor: '#ec4913',
                        borderWidth: 1.5,
                        borderRadius: 6,
                    }]
                },
                options: { ...chartDefaults }
            });

            // Revenue chart
            if (revenueChartInst) revenueChartInst.destroy();
            revenueChartInst = new Chart(document.getElementById('revenueChart'), {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        data: revenues,
                        borderColor: '#22c55e',
                        backgroundColor: 'rgba(34,197,94,0.1)',
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#22c55e',
                        pointRadius: 4,
                        borderWidth: 2,
                    }]
                },
                options: { ...chartDefaults }
            });

            // Status donut chart
            if (statusChartInst) statusChartInst.destroy();
            statusChartInst = new Chart(document.getElementById('statusChart'), {
                type: 'doughnut',
                data: {
                    labels: ['Paid', 'Unpaid', 'Failed'],
                    datasets: [{
                        data: [paid, unpaid, failed],
                        backgroundColor: ['rgba(34,197,94,0.8)', 'rgba(251,146,60,0.8)', 'rgba(239,68,68,0.8)'],
                        borderColor: ['#22c55e', '#fb923c', '#ef4444'],
                        borderWidth: 1.5,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'bottom',
                            labels: { color: 'rgba(255,255,255,0.5)', font: { family: 'Be Vietnam Pro', size: 10, weight: '700' }, padding: 12, boxWidth: 10 }
                        }
                    },
                    cutout: '65%'
                }
            });

            // Recent orders table
            const recent = orders.slice(0, 8);
            const tableEl = document.getElementById('recent-orders-table');
            if (tableEl) {
                tableEl.innerHTML = recent.length === 0
                    ? '<p class="text-xs text-white/30 text-center py-4">No orders yet</p>'
                    : recent.map(o => {
                        const isPaid = o.status === 'paid' || o.paymentStatus === 'paid';
                        const isFailed = o.status === 'payment-failed' || o.paymentStatus === 'failed';
                        const isUnpaid = o.paymentStatus === 'unpaid' || (!o.paymentStatus && o.status === 'pending');
                        const dot = isPaid ? 'bg-green-400' : isFailed ? 'bg-red-400' : 'bg-orange-400';
                        const status = isPaid ? 'Paid' : isFailed ? 'Failed' : isUnpaid ? 'Unpaid' : o.status;
                        const date = new Date(o.createdAt.seconds * 1000).toLocaleDateString();
                        return `
                        <div class="flex items-center justify-between py-2 border-b border-white/5 last:border-0">
                            <div class="flex items-center gap-2 min-w-0">
                                <div class="w-1.5 h-1.5 rounded-full ${dot} shrink-0"></div>
                                <p class="text-xs font-bold text-white/80 truncate">${o.type}</p>
                                <span class="text-[9px] text-white/30">×${o.quantity}</span>
                            </div>
                            <div class="flex items-center gap-3 shrink-0 ml-2">
                                <span class="text-[9px] font-black text-white/30">${date}</span>
                                <span class="text-[9px] font-black text-primary">Ksh ${o.total || '—'}</span>
                                <span class="text-[9px] font-black text-white/40">${status}</span>
                            </div>
                        </div>`;
                    }).join('');
            }

            // ── Ratings chart ──────────────────────────────────────────
            if (typeof window.fb_getRatingsStats === 'function') {
                try {
                    const { dist, total: rTotal, avg } = await window.fb_getRatingsStats();
                    const avgEl = document.getElementById('ratings-avg');
                    const starsEl = document.getElementById('ratings-stars');
                    const countEl = document.getElementById('ratings-count');
                    if (avgEl) avgEl.textContent = rTotal ? avg : '—';
                    if (countEl) countEl.textContent = `${rTotal} review${rTotal !== 1 ? 's' : ''}`;
                    if (starsEl && rTotal > 0) {
                        starsEl.innerHTML = [1,2,3,4,5].map(s =>
                            `<span class="material-symbols-outlined text-sm" style="color:${s <= Math.round(avg) ? '#fbbf24' : 'rgba(255,255,255,0.15)'}; font-variation-settings:'FILL' 1">star</span>`
                        ).join('');
                    }

                    // Bar chart
                    if (ratingsChartInst) ratingsChartInst.destroy();
                    ratingsChartInst = new Chart(document.getElementById('ratingsChart'), {
                        type: 'bar',
                        data: {
                            labels: ['1 ★','2 ★','3 ★','4 ★','5 ★'],
                            datasets: [{
                                data: [dist[1], dist[2], dist[3], dist[4], dist[5]],
                                backgroundColor: [
                                    'rgba(239,68,68,0.7)','rgba(251,146,60,0.7)',
                                    'rgba(234,179,8,0.7)','rgba(163,230,53,0.7)','rgba(34,197,94,0.7)'
                                ],
                                borderColor: ['#ef4444','#fb923c','#eab308','#a3e635','#22c55e'],
                                borderWidth: 1.5,
                                borderRadius: 6,
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                x: { grid: { display: false }, ticks: { color: 'rgba(255,255,255,0.4)', font: { family: 'Be Vietnam Pro', size: 10, weight: '700' } } },
                                y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: 'rgba(255,255,255,0.4)', font: { family: 'Be Vietnam Pro', size: 10, weight: '700' } }, beginAtZero: true, precision: 0 }
                            }
                        }
                    });

                    // Text breakdown bars
                    const bdEl = document.getElementById('ratings-breakdown');
                    if (bdEl) {
                        bdEl.innerHTML = [5,4,3,2,1].map(n => {
                            const pct = rTotal ? Math.round((dist[n] / rTotal) * 100) : 0;
                            const barColor = n >= 4 ? 'bg-green-400' : n === 3 ? 'bg-yellow-400' : n === 2 ? 'bg-orange-400' : 'bg-red-400';
                            return `
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] font-black text-white/40 w-3 shrink-0 text-right">${n}</span>
                                <span class="material-symbols-outlined text-xs text-yellow-400 shrink-0" style="font-variation-settings:'FILL' 1">star</span>
                                <div class="flex-1 h-1.5 bg-white/5 rounded-full overflow-hidden">
                                    <div class="h-full ${barColor} rounded-full transition-all duration-700" style="width:${pct}%"></div>
                                </div>
                                <span class="text-[10px] font-bold text-white/30 w-6 shrink-0 text-right">${dist[n]}</span>
                            </div>`;
                        }).join('');
                    }
                } catch (_) {}
            }

        } catch (err) {
            console.error('Stats load error:', err);
        }
    }

    document.addEventListener('auth-changed', () => {
        if (typeof window.fb_getOrdersWithStats === 'function') loadPageData();
    });
</script>
</body>
</html>
