<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta name="robots" content="noindex, nofollow, noarchive">
    <link rel="icon" type="image/png" href="../assets/images/logo.png">
    <title>Manage Updates | EzyBite Admin</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { extend: { colors: { primary: "#ec4913" }, fontFamily: { display: ["Be Vietnam Pro"] } } }
        }
    </script>
    <style>
        body { font-family: 'Be Vietnam Pro', sans-serif; background: #09090b; color: #fff; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .filled-icon { font-variation-settings: 'FILL' 1; }
        input, select, textarea { color: #fff !important; }
    </style>
</head>
<body class="dark min-h-screen">
<div id="admin-sidebar-placeholder"></div>

<div class="md:pl-44 pt-11 md:pt-0 min-h-screen">
    <div class="p-4 lg:p-6 max-w-3xl mx-auto">

        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-xl font-black text-white leading-none">Manage Updates</h1>
                <p class="text-white/40 text-xs font-medium mt-1">Post announcements, news and offers for users</p>
            </div>
            <button onclick="openAddModal()"
                    class="flex items-center gap-2 px-4 py-2 bg-primary text-white rounded-xl font-bold text-sm hover:bg-primary/90 active:scale-95 transition-all shadow-lg shadow-primary/30">
                <span class="material-symbols-outlined text-base">add</span> New Update
            </button>
        </div>

        <!-- List skeleton -->
        <div id="updates-loading" class="space-y-3">
            <div class="h-20 bg-zinc-900 rounded-2xl animate-pulse border border-white/5"></div>
            <div class="h-20 bg-zinc-900 rounded-2xl animate-pulse border border-white/5"></div>
        </div>

        <!-- Updates list -->
        <div id="updates-list" class="hidden space-y-3"></div>

        <!-- Empty state -->
        <div id="updates-empty" class="hidden py-20 text-center opacity-30">
            <span class="material-symbols-outlined text-5xl block mb-3 filled-icon">campaign</span>
            <p class="text-base font-bold uppercase tracking-widest">No updates yet</p>
            <p class="text-xs mt-1">Click "New Update" to create your first announcement</p>
        </div>
    </div>
</div>

<!-- Add Update Modal -->
<div id="add-update-modal"
     class="fixed inset-0 z-[200] hidden items-center justify-center bg-black/70 backdrop-blur-sm"
     onclick="if(event.target===this) closeAddModal()">
    <div class="bg-zinc-900 border border-white/10 rounded-2xl w-full max-w-sm mx-4 p-5 shadow-2xl animate-in zoom-in-95 fade-in duration-300">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-base font-black text-white">New Update</h2>
            <button onclick="closeAddModal()" class="w-7 h-7 flex items-center justify-center bg-white/5 hover:bg-white/10 rounded-full text-white/60 transition-all">
                <span class="material-symbols-outlined text-sm">close</span>
            </button>
        </div>
        <form id="add-update-form" class="space-y-3" onsubmit="handleAddUpdate(event)">
            <div>
                <label class="text-[10px] font-black uppercase text-white/30 tracking-widest block mb-1">Title *</label>
                <input name="title" type="text" required placeholder="Update title"
                       class="w-full px-3 py-2.5 bg-zinc-800 border border-white/10 rounded-xl text-sm font-bold placeholder:text-white/20 focus:ring-1 focus:ring-primary/40 outline-none">
            </div>
            <div>
                <label class="text-[10px] font-black uppercase text-white/30 tracking-widest block mb-1">Message / Body</label>
                <textarea name="body" placeholder="More details (optional)..."
                          class="w-full px-3 py-2.5 bg-zinc-800 border border-white/10 rounded-xl text-sm font-bold placeholder:text-white/20 focus:ring-1 focus:ring-primary/40 outline-none min-h-[80px] resize-none"></textarea>
            </div>
            <div>
                <label class="text-[10px] font-black uppercase text-white/30 tracking-widest block mb-1">Tag / Category</label>
                <select name="tag"
                        class="w-full px-3 py-2.5 bg-zinc-800 border border-white/10 rounded-xl text-sm font-bold focus:ring-1 focus:ring-primary/40 outline-none">
                    <option value="info">Info</option>
                    <option value="promo">Promo</option>
                    <option value="deal">Deal</option>
                    <option value="feature">New Feature</option>
                    <option value="alert">Alert</option>
                </select>
            </div>

            <!-- Error -->
            <div id="add-update-error" class="hidden flex items-center gap-2 px-3 py-2 bg-red-500/10 border border-red-500/20 rounded-xl">
                <span class="material-symbols-outlined text-red-400 text-sm shrink-0 filled-icon">error</span>
                <span id="add-update-error-msg" class="text-xs font-bold text-red-400"></span>
            </div>

            <div class="flex gap-2 pt-1">
                <button type="button" onclick="closeAddModal()"
                        class="flex-1 py-2.5 rounded-xl text-sm font-black border border-white/10 hover:bg-white/5 text-white/60 transition-all active:scale-95">
                    Cancel
                </button>
                <button type="submit" id="add-update-submit"
                        class="flex-1 py-2.5 rounded-xl text-sm font-black bg-primary text-white hover:bg-primary/90 transition-all active:scale-95 shadow-lg shadow-primary/30">
                    Post Update
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Confirm Delete Modal -->
<div id="delete-confirm-modal"
     class="fixed inset-0 z-[300] hidden items-center justify-center bg-black/70 backdrop-blur-sm">
    <div class="bg-zinc-900 border border-white/10 rounded-2xl w-full max-w-xs mx-4 p-5 shadow-2xl">
        <div class="text-center mb-4">
            <div class="w-12 h-12 bg-red-500/10 rounded-full flex items-center justify-center mx-auto mb-3">
                <span class="material-symbols-outlined text-red-400 text-2xl filled-icon">delete</span>
            </div>
            <p class="text-sm font-black text-white">Delete this update?</p>
            <p class="text-xs font-medium text-white/40 mt-1.5" id="delete-confirm-title"></p>
        </div>
        <div class="flex gap-2">
            <button onclick="closeDeleteConfirm()"
                    class="flex-1 py-2.5 rounded-xl text-sm font-black border border-white/10 hover:bg-white/5 text-white/60 transition-all active:scale-95">
                Cancel
            </button>
            <button onclick="confirmDelete()"
                    id="delete-confirm-btn"
                    class="flex-1 py-2.5 rounded-xl text-sm font-black bg-red-500 text-white hover:bg-red-600 transition-all active:scale-95">
                Delete
            </button>
        </div>
    </div>
</div>

<script type="module" src="../js/firebase-service.js"></script>
<script src="admin-shell.js"></script>
<script src="admin-auth.js"></script>
<script>
    const TAG_LABELS = { info:'Info', promo:'Promo', deal:'Deal', feature:'New Feature', alert:'Alert' };
    const TAG_ICONS  = { info:'info', promo:'local_offer', deal:'sell', feature:'new_releases', alert:'warning' };
    const TAG_CSS    = {
        info:    'bg-blue-500/10 text-blue-400',
        promo:   'bg-primary/10 text-primary',
        deal:    'bg-yellow-500/10 text-yellow-400',
        feature: 'bg-green-500/10 text-green-400',
        alert:   'bg-red-500/10 text-red-400'
    };

    let pendingDeleteId = null;

    function timeAgo(seconds) {
        const diff = Math.floor(Date.now() / 1000) - seconds;
        if (diff < 60)    return 'Just now';
        if (diff < 3600)  return `${Math.floor(diff / 60)}m ago`;
        if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
        const d = Math.floor(diff / 86400);
        if (d < 30) return `${d}d ago`;
        return new Date(seconds * 1000).toLocaleDateString('en-KE', { day:'numeric', month:'short', year:'numeric' });
    }

    function renderList(updates) {
        const listEl  = document.getElementById('updates-list');
        const emptyEl = document.getElementById('updates-empty');

        if (!updates.length) {
            listEl.classList.add('hidden');
            emptyEl.classList.remove('hidden');
            return;
        }
        emptyEl.classList.add('hidden');
        listEl.classList.remove('hidden');

        listEl.innerHTML = updates.map(u => {
            const tag   = u.tag || 'info';
            const icon  = TAG_ICONS[tag] || 'notifications';
            const label = TAG_LABELS[tag] || tag;
            const css   = TAG_CSS[tag] || TAG_CSS.info;
            const date  = timeAgo(u.createdAt?.seconds || 0);
            return `
            <div class="flex items-start gap-3 p-4 bg-zinc-900 border border-white/5 rounded-2xl group hover:border-white/10 transition-all">
                <div class="w-9 h-9 rounded-xl bg-white/5 flex items-center justify-center shrink-0 mt-0.5">
                    <span class="material-symbols-outlined text-base filled-icon ${css.split(' ')[1]}">${icon}</span>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 flex-wrap mb-0.5">
                        <span class="text-sm font-black text-white leading-tight">${u.title}</span>
                        <span class="text-[9px] font-black uppercase tracking-widest px-1.5 py-0.5 rounded-full ${css}">${label}</span>
                    </div>
                    ${u.body ? `<p class="text-xs font-medium text-white/45 leading-relaxed">${u.body}</p>` : ''}
                    <p class="text-[10px] text-white/20 font-bold mt-1">${date}</p>
                </div>
                <button onclick="openDeleteConfirm('${u.id}', \`${u.title.replace(/`/g, "\\`")}\`)"
                        class="shrink-0 w-8 h-8 flex items-center justify-center bg-red-500/0 hover:bg-red-500/10 rounded-xl text-white/20 hover:text-red-400 transition-all active:scale-90">
                    <span class="material-symbols-outlined text-base">delete</span>
                </button>
            </div>`;
        }).join('');
    }

    async function loadPageData() {
        document.getElementById('updates-loading').classList.remove('hidden');
        document.getElementById('updates-list').classList.add('hidden');
        document.getElementById('updates-empty').classList.add('hidden');
        try {
            const updates = await window.fb_getUpdates();
            document.getElementById('updates-loading').classList.add('hidden');
            renderList(updates);
        } catch (err) {
            document.getElementById('updates-loading').classList.add('hidden');
            document.getElementById('updates-empty').classList.remove('hidden');
            console.error('Failed to load updates:', err);
        }
    }

    // ── Add Modal ────────────────────────────────────────────────────────────
    function openAddModal() {
        document.getElementById('add-update-form').reset();
        document.getElementById('add-update-error').classList.add('hidden');
        document.getElementById('add-update-submit').disabled = false;
        document.getElementById('add-update-submit').textContent = 'Post Update';
        const modal = document.getElementById('add-update-modal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
    }

    function closeAddModal() {
        const modal = document.getElementById('add-update-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
    }

    async function handleAddUpdate(e) {
        e.preventDefault();
        const form   = e.target;
        const btn    = document.getElementById('add-update-submit');
        const errDiv = document.getElementById('add-update-error');
        const errMsg = document.getElementById('add-update-error-msg');

        const title = form.title.value.trim();
        const body  = form.body.value.trim();
        const tag   = form.tag.value;

        if (!title) {
            errMsg.textContent = 'Title is required.';
            errDiv.classList.remove('hidden');
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Posting…';
        errDiv.classList.add('hidden');

        try {
            await window.fb_createUpdate({ title, body, tag });
            closeAddModal();
            window.showToast && window.showToast('Update posted!', 'success');
            loadPageData();
        } catch (err) {
            errMsg.textContent = err.message || 'Failed to post update.';
            errDiv.classList.remove('hidden');
            btn.disabled = false;
            btn.textContent = 'Post Update';
        }
    }

    // ── Delete Confirm ───────────────────────────────────────────────────────
    function openDeleteConfirm(id, title) {
        pendingDeleteId = id;
        document.getElementById('delete-confirm-title').textContent = title;
        const modal = document.getElementById('delete-confirm-modal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
    }

    function closeDeleteConfirm() {
        pendingDeleteId = null;
        const modal = document.getElementById('delete-confirm-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
    }

    async function confirmDelete() {
        if (!pendingDeleteId) return;
        const btn = document.getElementById('delete-confirm-btn');
        btn.disabled = true;
        btn.textContent = 'Deleting…';
        try {
            await window.fb_deleteUpdate(pendingDeleteId);
            closeDeleteConfirm();
            window.showToast && window.showToast('Update deleted.', 'success');
            loadPageData();
        } catch (err) {
            btn.disabled = false;
            btn.textContent = 'Delete';
            window.showToast && window.showToast('Delete failed: ' + err.message, 'error');
        }
    }

    // ── Init ─────────────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
        const tryLoad = () => {
            if (typeof window.fb_getUpdates === 'function') {
                loadPageData();
            } else {
                setTimeout(tryLoad, 300);
            }
        };
        tryLoad();
    });
</script>
</body>
</html>
