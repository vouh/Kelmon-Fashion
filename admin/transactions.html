<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>EzyBite | Successful Payments</title>
    <link rel="icon" type="image/png" href="../assets/images/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#ec4913' }, fontFamily: { sans: ['Be Vietnam Pro', 'sans-serif'] } } }
        }
    </script>
    <style>
        body { font-family: 'Be Vietnam Pro', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .filled-icon { font-variation-settings: 'FILL' 1; }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">
<div id="admin-sidebar-placeholder"></div>

<div class="md:pl-44 pt-11 md:pt-0 min-h-screen flex flex-col">

    <!-- Topbar -->
    <div class="hidden md:flex items-center justify-between px-6 py-3 border-b border-white/5 bg-zinc-950 sticky top-0 z-20">
        <div>
            <h1 class="text-base font-black text-white flex items-center gap-2">
                <span class="material-symbols-outlined filled-icon text-green-400 text-lg">check_circle</span>
                Successful Payments
            </h1>
            <p class="text-[10px] font-bold uppercase tracking-widest text-white/30">All confirmed M-Pesa transactions</p>
        </div>
        <div class="flex items-center gap-3">
            <div class="bg-zinc-900 border border-white/5 rounded-xl px-4 py-2">
                <span class="text-[9px] font-black uppercase tracking-widest text-white/30 block">Total Collected</span>
                <span id="total-collected" class="text-base font-black text-green-400">—</span>
            </div>
            <button onclick="loadPageData()" class="flex items-center gap-1.5 px-3 py-1.5 bg-white/5 hover:bg-white/10 rounded-lg text-white/60 hover:text-white text-xs font-bold transition-all">
                <span class="material-symbols-outlined text-sm">refresh</span>
            </button>
        </div>
    </div>

    <!-- Mobile total -->
    <div class="md:hidden px-4 py-3 border-b border-white/5 flex items-center justify-between">
        <span class="text-xs font-bold text-white/30 uppercase tracking-widest">Total Collected</span>
        <span id="total-collected-mobile" class="font-black text-green-400 text-sm">—</span>
    </div>

    <main class="flex-1 p-4 md:p-6 space-y-3">
        <!-- Count badge -->
        <div class="flex items-center gap-2">
            <span class="text-[9px] font-black uppercase tracking-widest text-white/30">Transactions</span>
            <span id="txn-count" class="px-2 py-0.5 rounded-full bg-green-500/10 text-green-400 text-[9px] font-black">0</span>
        </div>

        <!-- Bulk Delete Toolbar -->
        <div id="txn-bulk-toolbar" class="hidden items-center justify-between px-3 py-2 bg-red-500/10 border border-red-500/20 rounded-xl">
            <div class="flex items-center gap-2">
                <input type="checkbox" id="select-all-txns" onchange="toggleSelectAllTxns(this.checked)" class="accent-primary w-4 h-4 cursor-pointer">
                <span id="txn-selected-count" class="text-xs font-black text-red-400">0 selected</span>
            </div>
            <button onclick="bulkDeleteTxns()" class="flex items-center gap-1.5 px-3 py-1.5 bg-red-500 text-white rounded-lg text-xs font-black hover:bg-red-600 active:scale-95 transition-all">
                <span class="material-symbols-outlined text-sm">delete</span>
                Delete Selected
            </button>
        </div>

        <div id="txn-list" class="space-y-2">
            <div class="p-6 text-center text-white/20 text-xs font-bold uppercase tracking-widest animate-pulse">Loading…</div>
        </div>
    </main>
</div>

<script type="module" src="../js/firebase-service.js"></script>
<script src="../js/auth.js"></script>
<script src="admin-shell.js"></script>
<script>
async function loadPageData() {
    const listEl = document.getElementById('txn-list');
    listEl.innerHTML = '<div class="p-6 text-center text-white/20 text-xs font-bold uppercase animate-pulse">Loading…</div>';
    try {
        const orders = await window.fb_getAllOrders();
        const paid = orders.filter(o =>
            o.status === 'paid' ||
            o.status === 'delivered' ||
            o.paymentStatus === 'paid'
        );

        const total = paid.reduce((s, o) => s + (o.paymentDetails?.amount || o.total || 0), 0);
        const totalStr = `Ksh ${Math.round(total).toLocaleString()}`;
        document.getElementById('total-collected').textContent = totalStr;
        document.getElementById('total-collected-mobile').textContent = totalStr;
        document.getElementById('txn-count').textContent = paid.length;

        listEl.innerHTML = paid.length ? paid.map(o => {
            const pd  = o.paymentDetails || {};
            const dt  = pd.transactionDate
                ? (() => { const s = String(pd.transactionDate); return s.length === 14 ? `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)} ${s.slice(8,10)}:${s.slice(10,12)}` : s; })()
                : new Date(o.createdAt.seconds * 1000).toLocaleString();
            return `
            <div class="bg-zinc-900 rounded-xl border border-white/5 hover:border-green-500/20 transition-all p-4 flex gap-3">
                <input type="checkbox" class="txn-checkbox accent-primary w-4 h-4 cursor-pointer shrink-0 mt-1" data-id="${o.id}" onchange="onTxnCheckboxChange()">
                <div class="flex items-start gap-3 flex-1 min-w-0">
                    <div class="w-9 h-9 shrink-0 rounded-xl bg-green-500/10 flex items-center justify-center">
                        <span class="material-symbols-outlined filled-icon text-green-400 text-lg">check_circle</span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between gap-2 flex-wrap">
                            <p class="font-black text-white text-sm truncate">${o.type}</p>
                            <span class="font-black text-green-400 text-sm shrink-0">Ksh ${Math.round(pd.amount || o.total || 0).toLocaleString()}</span>
                        </div>
                        <div class="mt-1 flex flex-wrap gap-x-3 gap-y-0.5 text-[10px] font-bold text-white/30">
                            ${pd.mpesaReceiptNumber ? `<span class="text-green-400/70">Receipt: ${pd.mpesaReceiptNumber}</span>` : ''}
                            ${pd.phoneNumber ? `<span>📱 ${pd.phoneNumber}</span>` : ''}
                            <span>${dt}</span>
                            <span>Order #${o.id.slice(-6)}</span>
                            <span>${o.isGuest ? 'Guest' : 'Member'} · #${o.userId?.slice(-8)}</span>
                        </div>
                    </div>
                    <button onclick="deleteTxn('${o.id}')" title="Delete" class="shrink-0 w-7 h-7 flex items-center justify-center bg-red-500/10 hover:bg-red-500/30 rounded-lg text-red-400 transition-all">
                        <span class="material-symbols-outlined text-xs">delete</span>
                    </button>
                </div>
            </div>`;
        }).join('')
        : '<div class="p-8 text-center text-white/20 text-xs font-bold uppercase">No successful payments yet</div>';

    } catch (e) { console.error(e); }
}

document.addEventListener('auth-changed', loadPageData);
setTimeout(loadPageData, 1500);

// ── Individual + Bulk Delete ─────────────────────────────────────────────────
let _selectedTxns = new Set();

async function deleteTxn(id) {
    if (!confirm('Delete this payment record? This cannot be undone.')) return;
    try {
        await window.fb_deleteOrder(id);
        loadPageData();
    } catch(e) { alert('Delete failed: ' + e.message); }
}

function onTxnCheckboxChange() {
    _selectedTxns.clear();
    document.querySelectorAll('.txn-checkbox:checked').forEach(cb => _selectedTxns.add(cb.dataset.id));
    const toolbar  = document.getElementById('txn-bulk-toolbar');
    const countEl  = document.getElementById('txn-selected-count');
    const selectAll = document.getElementById('select-all-txns');
    if (_selectedTxns.size > 0) { toolbar.classList.remove('hidden'); toolbar.classList.add('flex'); }
    else { toolbar.classList.remove('flex'); toolbar.classList.add('hidden'); }
    countEl.textContent = `${_selectedTxns.size} selected`;
    const all = document.querySelectorAll('.txn-checkbox');
    selectAll.checked = all.length > 0 && _selectedTxns.size === all.length;
    selectAll.indeterminate = _selectedTxns.size > 0 && _selectedTxns.size < all.length;
}

function toggleSelectAllTxns(checked) {
    document.querySelectorAll('.txn-checkbox').forEach(cb => { cb.checked = checked; });
    onTxnCheckboxChange();
}

async function bulkDeleteTxns() {
    const ids = [..._selectedTxns];
    if (ids.length === 0) return;
    if (!confirm(`Delete ${ids.length} payment record(s)? This cannot be undone.`)) return;
    const toolbar = document.getElementById('txn-bulk-toolbar');
    toolbar.innerHTML = '<span class="text-xs text-red-400 font-bold animate-pulse mx-auto">Deleting\u2026</span>';
    for (const id of ids) {
        try { await window.fb_deleteOrder(id); } catch(e) { console.error('Delete failed:', id, e); }
    }
    _selectedTxns.clear();
    loadPageData();
}
</script>
</body>
</html>
