<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta name="robots" content="noindex, nofollow, noarchive">
    <link rel="icon" type="image/png" href="../assets/images/logo.png">
    <title>Manage Deals | EzyBite Admin</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { extend: { colors: { primary: "#ec4913" }, fontFamily: { display: ["Be Vietnam Pro"] } } }
        }
    </script>
    <style>
        body { font-family: 'Be Vietnam Pro', sans-serif; background: #09090b; color: #fff; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .filled-icon { font-variation-settings: 'FILL' 1; }
        input, select, textarea { color: #fff !important; }
    </style>
</head>
<body class="dark min-h-screen">
<div id="admin-sidebar-placeholder"></div>

<div class="md:pl-44 pt-11 md:pt-0 min-h-screen">
    <div class="p-4 lg:p-6 max-w-5xl mx-auto">

        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-xl font-black text-white leading-none">Manage Deals</h1>
                <p class="text-white/40 text-xs font-medium mt-1">Add or remove deals shown to users</p>
            </div>
            <button onclick="openAddDealModal()"
                    class="flex items-center gap-2 px-4 py-2 bg-primary text-white rounded-xl font-bold text-sm hover:bg-primary/90 active:scale-95 transition-all shadow-lg shadow-primary/30">
                <span class="material-symbols-outlined text-base">add</span> Add Deal
            </button>
        </div>

        <!-- Deals Grid -->
        <div id="deals-loading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="h-40 bg-zinc-900 rounded-2xl animate-pulse border border-white/5"></div>
            <div class="h-40 bg-zinc-900 rounded-2xl animate-pulse border border-white/5"></div>
            <div class="h-40 bg-zinc-900 rounded-2xl animate-pulse border border-white/5"></div>
        </div>

        <!-- Bulk Delete Toolbar -->
        <div id="deal-bulk-toolbar" class="hidden items-center justify-between px-3 py-2 bg-red-500/10 border border-red-500/20 rounded-xl mb-2">
            <div class="flex items-center gap-2">
                <input type="checkbox" id="select-all-deals" onchange="toggleSelectAllDeals(this.checked)" class="accent-primary w-4 h-4 cursor-pointer">
                <span id="deals-selected-count" class="text-xs font-black text-red-400">0 selected</span>
            </div>
            <button onclick="bulkDeleteDeals()" class="flex items-center gap-1.5 px-3 py-1.5 bg-red-500 text-white rounded-lg text-xs font-black hover:bg-red-600 active:scale-95 transition-all">
                <span class="material-symbols-outlined text-sm">delete</span>
                Delete Selected
            </button>
        </div>

        <div id="deals-grid" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

        <div id="deals-empty" class="hidden py-20 text-center opacity-30">
            <span class="material-symbols-outlined text-5xl block mb-3">local_offer</span>
            <p class="text-base font-bold uppercase tracking-widest">No deals yet</p>
            <p class="text-xs mt-1">Click "Add Deal" to create your first deal</p>
        </div>
    </div>
</div>

<!-- Add Deal Modal -->
<div id="add-deal-modal" class="fixed inset-0 z-[200] hidden items-center justify-center bg-black/70 backdrop-blur-sm"
     onclick="if(event.target===this) closeAddDealModal()">
    <div class="bg-zinc-900 border border-white/10 rounded-2xl w-full max-w-sm mx-4 p-5 shadow-2xl animate-in zoom-in-95 fade-in duration-300">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-base font-black text-white">New Deal</h2>
            <button onclick="closeAddDealModal()" class="w-7 h-7 flex items-center justify-center bg-white/5 hover:bg-white/10 rounded-full text-white/60 transition-all">
                <span class="material-symbols-outlined text-sm">close</span>
            </button>
        </div>
        <form id="add-deal-form" class="space-y-3" onsubmit="handleAddDeal(event)">
            <div>
                <label class="text-[10px] font-black uppercase text-white/30 tracking-widest block mb-1">Title *</label>
                <input name="title" type="text" required placeholder="Deal title" class="w-full px-3 py-2.5 bg-zinc-800 border border-white/10 rounded-xl text-sm font-bold text-white placeholder:text-white/20 focus:ring-1 focus:ring-primary/40 outline-none">
            </div>
            <div>
                <label class="text-[10px] font-black uppercase text-white/30 tracking-widest block mb-1">Description</label>
                <textarea name="description" placeholder="Short description..." class="w-full px-3 py-2.5 bg-zinc-800 border border-white/10 rounded-xl text-sm font-bold text-white placeholder:text-white/20 focus:ring-1 focus:ring-primary/40 outline-none min-h-[70px] resize-none"></textarea>
            </div>
            <div>
                <label class="text-[10px] font-black uppercase text-white/30 tracking-widest block mb-1">Image URL (optional)</label>
                <input name="imageUrl" type="url" placeholder="https://..." class="w-full px-3 py-2.5 bg-zinc-800 border border-white/10 rounded-xl text-sm font-bold text-white placeholder:text-white/20 focus:ring-1 focus:ring-primary/40 outline-none">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-[10px] font-black uppercase text-white/30 tracking-widest block mb-1">Badge (optional)</label>
                    <input name="badge" type="text" placeholder="e.g. Hot Deal" class="w-full px-3 py-2.5 bg-zinc-800 border border-white/10 rounded-xl text-sm font-bold text-white placeholder:text-white/20 focus:ring-1 focus:ring-primary/40 outline-none">
                </div>
                <div>
                    <label class="text-[10px] font-black uppercase text-white/30 tracking-widest block mb-1">Code (optional)</label>
                    <input name="code" type="text" placeholder="e.g. SAVE20" class="w-full px-3 py-2.5 bg-zinc-800 border border-white/10 rounded-xl text-sm font-bold text-white placeholder:text-white/20 focus:ring-1 focus:ring-primary/40 outline-none uppercase">
                </div>
            </div>
            <button type="submit" id="add-deal-btn"
                    class="w-full bg-primary text-white py-2.5 rounded-xl font-black text-sm hover:bg-primary/90 active:scale-95 transition-all shadow-lg shadow-primary/30 flex items-center justify-center gap-2">
                <span class="material-symbols-outlined text-base">add_circle</span> Add Deal
            </button>
        </form>
    </div>
</div>

<script type="module" src="../js/firebase-service.js"></script>
<script src="admin-shell.js"></script>
<script>
    async function loadDeals() {
        try {
            const deals = await window.fb_getDeals();
            document.getElementById('deals-loading')?.remove();
            const grid = document.getElementById('deals-grid');
            const empty = document.getElementById('deals-empty');

            if (!deals || deals.length === 0) {
                empty.classList.remove('hidden');
                return;
            }

            grid.classList.remove('hidden');
            grid.innerHTML = deals.map(deal => `
                <div class="bg-zinc-900 border border-white/10 rounded-2xl overflow-hidden group hover:border-white/20 transition-all relative">
                    <input type="checkbox" class="deal-checkbox absolute top-2 left-2 z-10 accent-primary w-4 h-4 cursor-pointer" data-id="${deal.id}" onchange="onDealCheckboxChange()">
                    ${deal.imageUrl ? `
                        <div class="w-full h-28 overflow-hidden">
                            <img src="${deal.imageUrl}" alt="${deal.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"/>
                        </div>` : `
                        <div class="w-full h-28 bg-gradient-to-br from-primary/20 to-zinc-800 flex items-center justify-center">
                            <span class="material-symbols-outlined text-3xl text-primary/40">local_offer</span>
                        </div>`}
                    <div class="p-3">
                        <div class="flex items-start justify-between gap-2 mb-1">
                            <h3 class="text-sm font-black text-white">${deal.title}</h3>
                            <button onclick="deleteDeal('${deal.id}')"
                                    class="shrink-0 w-6 h-6 flex items-center justify-center bg-red-500/10 hover:bg-red-500/30 rounded-lg text-red-400 transition-all">
                                <span class="material-symbols-outlined text-xs">delete</span>
                            </button>
                        </div>
                        ${deal.badge ? `<span class="inline-block px-2 py-0.5 text-[9px] font-black uppercase tracking-widest rounded-full bg-primary/20 text-primary mb-1">${deal.badge}</span>` : ''}
                        <p class="text-xs text-white/40 font-medium leading-relaxed line-clamp-2">${deal.description || ''}</p>
                        ${deal.code ? `<div class="mt-2 px-2 py-1 bg-primary/10 rounded-lg text-[10px] font-black text-primary tracking-widest uppercase text-center">CODE: ${deal.code}</div>` : ''}
                    </div>
                </div>
            `).join('');
        } catch (err) {
            console.error('Failed to load deals:', err);
        }
    }

    async function deleteDeal(id) {
        if (!confirm('Delete this deal?')) return;
        try {
            await window.fb_deleteDeal(id);
            loadDeals();
        } catch (err) {
            alert('Failed to delete deal: ' + err.message);
        }
    }

    function openAddDealModal() {
        const m = document.getElementById('add-deal-modal');
        if (m) { m.classList.remove('hidden'); m.classList.add('flex'); }
    }
    function closeAddDealModal() {
        const m = document.getElementById('add-deal-modal');
        if (m) { m.classList.add('hidden'); m.classList.remove('flex'); }
        document.getElementById('add-deal-form')?.reset();
    }

    async function handleAddDeal(event) {
        event.preventDefault();
        const btn = document.getElementById('add-deal-btn');
        btn.disabled = true;
        btn.innerHTML = '<span class="animate-spin material-symbols-outlined text-base">sync</span> Saving…';

        const fd = new FormData(event.target);
        const data = Object.fromEntries(fd.entries());
        // Remove empty optional fields
        Object.keys(data).forEach(k => { if (!data[k]) delete data[k]; });

        try {
            await window.fb_createDeal(data);
            closeAddDealModal();
            loadDeals();
        } catch (err) {
            alert('Failed to add deal: ' + err.message);
        }
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined text-base">add_circle</span> Add Deal';
    }

    // Load when firebase is ready
    document.addEventListener('auth-changed', () => {
        if (typeof window.fb_getDeals === 'function') loadDeals();
    });

    // ── Bulk Delete Deals ──────────────────────────────────────────────────────
    let _selectedDeals = new Set();

    function onDealCheckboxChange() {
        _selectedDeals.clear();
        document.querySelectorAll('.deal-checkbox:checked').forEach(cb => _selectedDeals.add(cb.dataset.id));
        const toolbar = document.getElementById('deal-bulk-toolbar');
        const countEl = document.getElementById('deals-selected-count');
        const selectAll = document.getElementById('select-all-deals');
        if (_selectedDeals.size > 0) { toolbar.classList.remove('hidden'); toolbar.classList.add('flex'); }
        else { toolbar.classList.remove('flex'); toolbar.classList.add('hidden'); }
        countEl.textContent = `${_selectedDeals.size} selected`;
        const all = document.querySelectorAll('.deal-checkbox');
        selectAll.checked = all.length > 0 && _selectedDeals.size === all.length;
        selectAll.indeterminate = _selectedDeals.size > 0 && _selectedDeals.size < all.length;
    }

    function toggleSelectAllDeals(checked) {
        document.querySelectorAll('.deal-checkbox').forEach(cb => { cb.checked = checked; });
        onDealCheckboxChange();
    }

    async function bulkDeleteDeals() {
        const ids = [..._selectedDeals];
        if (ids.length === 0) return;
        if (!confirm(`Delete ${ids.length} deal(s)? This cannot be undone.`)) return;
        const toolbar = document.getElementById('deal-bulk-toolbar');
        toolbar.innerHTML = '<span class="text-xs text-red-400 font-bold animate-pulse mx-auto">Deleting…</span>';
        for (const id of ids) {
            try { await window.fb_deleteDeal(id); } catch(e) { console.error('Delete failed:', id, e); }
        }
        _selectedDeals.clear();
        loadDeals();
    }
</script>
</body>
</html>
