<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>EzyBite | Failed Payments</title>
    <link rel="icon" type="image/png" href="../assets/images/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#ec4913' }, fontFamily: { sans: ['Be Vietnam Pro', 'sans-serif'] } } }
        }
    </script>
    <style>
        body { font-family: 'Be Vietnam Pro', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .filled-icon { font-variation-settings: 'FILL' 1; }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">
<div id="admin-sidebar-placeholder"></div>

<div class="md:pl-44 pt-11 md:pt-0 min-h-screen flex flex-col">

    <!-- Topbar -->
    <div class="hidden md:flex items-center justify-between px-6 py-3 border-b border-white/5 bg-zinc-950 sticky top-0 z-20">
        <div>
            <h1 class="text-base font-black text-white flex items-center gap-2">
                <span class="material-symbols-outlined filled-icon text-red-400 text-lg">cancel</span>
                Failed Payments
            </h1>
            <p class="text-[10px] font-bold uppercase tracking-widest text-white/30">Declined & cancelled M-Pesa transactions</p>
        </div>
        <div class="flex items-center gap-3">
            <div class="bg-zinc-900 border border-white/5 rounded-xl px-4 py-2">
                <span class="text-[9px] font-black uppercase tracking-widest text-white/30 block">Failed Count</span>
                <span id="fail-count-top" class="text-base font-black text-red-400">—</span>
            </div>
            <button onclick="loadPageData()" class="flex items-center gap-1.5 px-3 py-1.5 bg-white/5 hover:bg-white/10 rounded-lg text-white/60 hover:text-white text-xs font-bold transition-all">
                <span class="material-symbols-outlined text-sm">refresh</span>
            </button>
        </div>
    </div>

    <!-- Mobile header -->
    <div class="md:hidden px-4 py-3 border-b border-white/5 flex items-center justify-between">
        <span class="text-xs font-bold text-white/30 uppercase tracking-widest">Failed Payments</span>
        <span id="fail-count-mobile" class="font-black text-red-400 text-sm">—</span>
    </div>

    <main class="flex-1 p-4 md:p-6 space-y-3">
        <div class="flex items-center gap-2">
            <span class="text-[9px] font-black uppercase tracking-widest text-white/30">Records</span>
            <span id="fail-count" class="px-2 py-0.5 rounded-full bg-red-500/10 text-red-400 text-[9px] font-black">0</span>
        </div>

        <!-- Bulk Delete Toolbar -->
        <div id="fail-bulk-toolbar" class="hidden items-center justify-between px-3 py-2 bg-red-500/10 border border-red-500/20 rounded-xl">
            <div class="flex items-center gap-2">
                <input type="checkbox" id="select-all-fails" onchange="toggleSelectAllFails(this.checked)" class="accent-primary w-4 h-4 cursor-pointer">
                <span id="fail-selected-count" class="text-xs font-black text-red-400">0 selected</span>
            </div>
            <button onclick="bulkDeleteFails()" class="flex items-center gap-1.5 px-3 py-1.5 bg-red-500 text-white rounded-lg text-xs font-black hover:bg-red-600 active:scale-95 transition-all">
                <span class="material-symbols-outlined text-sm">delete</span>
                Delete Selected
            </button>
        </div>

        <div id="fail-list" class="space-y-2">
            <div class="p-6 text-center text-white/20 text-xs font-bold uppercase tracking-widest animate-pulse">Loading…</div>
        </div>
    </main>
</div>

<script type="module" src="../js/firebase-service.js"></script>
<script src="../js/auth.js"></script>
<script src="admin-shell.js"></script>
<script>
// M-Pesa result code → human-readable reason
const FAILURE_REASONS = {
    1:    'Insufficient funds',
    1032: 'Request cancelled by user',
    1037: 'DS timeout — user did not complete',
    2001: 'Wrong PIN entered',
    17:   'M-Pesa transaction limit reached',
    20:   'Transaction expired',
    26:   'System busy, try again later',
    9999: 'Unknown internal error',
};

function failReason(order) {
    // Fields saved by callback.js
    const code = order.paymentResultCode ?? order.paymentDetails?.ResultCode;
    const desc = order.paymentError || order.paymentDetails?.ResultDesc;
    if (code !== undefined && code !== null) {
        return FAILURE_REASONS[Number(code)] || desc || `Error code: ${code}`;
    }
    return desc || 'Payment was not completed';
}

async function loadPageData() {
    const listEl = document.getElementById('fail-list');
    listEl.innerHTML = '<div class="p-6 text-center text-white/20 text-xs font-bold uppercase animate-pulse">Loading…</div>';
    try {
        const orders = await window.fb_getAllOrders();
        const failed = orders.filter(o =>
            o.status === 'payment-failed' ||
            o.paymentStatus === 'failed'
        );

        const countStr = String(failed.length);
        document.getElementById('fail-count-top').textContent    = countStr;
        document.getElementById('fail-count-mobile').textContent = countStr;
        document.getElementById('fail-count').textContent        = countStr;

        listEl.innerHTML = failed.length ? failed.map(o => {
            const reason = failReason(o);
            const dt = new Date(o.createdAt.seconds * 1000);
            return `
            <div class="bg-zinc-900 rounded-xl border border-white/5 hover:border-red-500/20 transition-all p-4 flex gap-3">
                <input type="checkbox" class="fail-checkbox accent-primary w-4 h-4 cursor-pointer shrink-0 mt-1" data-id="${o.id}" onchange="onFailCheckboxChange()">
                <div class="flex items-start gap-3 flex-1 min-w-0">
                    <div class="w-9 h-9 shrink-0 rounded-xl bg-red-500/10 flex items-center justify-center">
                        <span class="material-symbols-outlined filled-icon text-red-400 text-lg">cancel</span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-start justify-between gap-2 flex-wrap">
                            <p class="font-black text-white text-sm truncate">${o.type}</p>
                            <span class="font-black text-white/40 text-sm shrink-0">Ksh ${Math.round(o.total || 0).toLocaleString()}</span>
                        </div>

                        <!-- Failure reason banner -->
                        <div class="mt-1.5 px-2.5 py-1.5 bg-red-500/10 border border-red-500/10 rounded-lg flex items-center gap-2">
                            <span class="material-symbols-outlined text-red-400 text-sm">warning</span>
                            <span class="text-[11px] font-bold text-red-300">${reason}</span>
                        </div>

                        <div class="mt-1.5 flex flex-wrap gap-x-3 gap-y-0.5 text-[10px] font-bold text-white/30">
                            <span>${dt.toLocaleDateString()} ${dt.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span>
                            <span>Order #${o.id.slice(-6)}</span>
                            <span>${o.isGuest ? 'Guest' : 'Member'} · #${o.userId?.slice(-8)}</span>
                            ${o.paymentDetails?.phoneNumber ? `<span>📱 ${o.paymentDetails.phoneNumber}</span>` : ''}
                        </div>
                    </div>
                    <button onclick="deleteFail('${o.id}')" title="Delete" class="shrink-0 w-7 h-7 flex items-center justify-center bg-red-500/10 hover:bg-red-500/30 rounded-lg text-red-400 transition-all self-start">
                        <span class="material-symbols-outlined text-xs">delete</span>
                    </button>
                </div>
            </div>`;
        }).join('')
        : '<div class="p-8 text-center text-white/20 text-xs font-bold uppercase">No failed payments on record</div>';

    } catch (e) { console.error(e); }
}

document.addEventListener('auth-changed', loadPageData);
setTimeout(loadPageData, 1500);

// ── Individual + Bulk Delete ─────────────────────────────────────────────────
let _selectedFails = new Set();

async function deleteFail(id) {
    if (!confirm('Delete this failed payment record? This cannot be undone.')) return;
    try {
        await window.fb_deleteOrder(id);
        loadPageData();
    } catch(e) { alert('Delete failed: ' + e.message); }
}

function onFailCheckboxChange() {
    _selectedFails.clear();
    document.querySelectorAll('.fail-checkbox:checked').forEach(cb => _selectedFails.add(cb.dataset.id));
    const toolbar  = document.getElementById('fail-bulk-toolbar');
    const countEl  = document.getElementById('fail-selected-count');
    const selectAll = document.getElementById('select-all-fails');
    if (_selectedFails.size > 0) { toolbar.classList.remove('hidden'); toolbar.classList.add('flex'); }
    else { toolbar.classList.remove('flex'); toolbar.classList.add('hidden'); }
    countEl.textContent = `${_selectedFails.size} selected`;
    const all = document.querySelectorAll('.fail-checkbox');
    selectAll.checked = all.length > 0 && _selectedFails.size === all.length;
    selectAll.indeterminate = _selectedFails.size > 0 && _selectedFails.size < all.length;
}

function toggleSelectAllFails(checked) {
    document.querySelectorAll('.fail-checkbox').forEach(cb => { cb.checked = checked; });
    onFailCheckboxChange();
}

async function bulkDeleteFails() {
    const ids = [..._selectedFails];
    if (ids.length === 0) return;
    if (!confirm(`Delete ${ids.length} failed payment record(s)? This cannot be undone.`)) return;
    const toolbar = document.getElementById('fail-bulk-toolbar');
    toolbar.innerHTML = '<span class="text-xs text-red-400 font-bold animate-pulse mx-auto">Deleting\u2026</span>';
    for (const id of ids) {
        try { await window.fb_deleteOrder(id); } catch(e) { console.error('Delete failed:', id, e); }
    }
    _selectedFails.clear();
    loadPageData();
}
</script>
</body>
</html>
